services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - COMPOSER_PROCESS_TIMEOUT=2000
    container_name: loyalty-app-new
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - loyalty_network
    depends_on:
      - db
      - redis
    mem_limit: 1g
    environment:
      - PHP_MEMORY_LIMIT=512M
    # Jika menggunakan PHP-FPM (port 9000) - TIDAK PERLU ports
    # karena Nginx yang akan terhubung ke port 9000

  db:
    image: mysql:8.0
    container_name: loyalty-db-new
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-loyalty_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - loyalty_network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    container_name: loyalty-redis-new
    restart: unless-stopped
    networks:
      - loyalty_network
    volumes:
      - redis_data:/data

  webserver:
    image: nginx:alpine
    container_name: loyalty-nginx
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ./:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - loyalty_network
    depends_on:
      - app

volumes:
  db_data:
  redis_data:

networks:
  loyalty_network:
    driver: bridge