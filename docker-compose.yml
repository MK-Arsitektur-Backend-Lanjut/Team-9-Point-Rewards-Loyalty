>>>>>>> Stashed changes

  db:
    image: mysql:8.0
    container_name: loyalty-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-loyalty_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - loyalty_network
    command: --default-authentication-plugin=mysql_native_password --max_connections=2000

  webserver:
    image: nginx:alpine
    container_name: loyalty-nginx
    restart: unless-stopped
    ports:
      - "8001:8000"  # ← Port diubah menjadi 8001
    volumes:
      - ./:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - loyalty_network
    depends_on:
      - app

  redis:
    image: redis:7.0-alpine
    container_name: loyalty-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - loyalty_network

volumes:
  db_data:
  redis_data:

networks:
  loyalty_network:
    driver: bridge
