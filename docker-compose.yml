version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - COMPOSER_PROCESS_TIMEOUT=2000
    container_name: loyalty-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - loyalty_network
    depends_on:
      - db
