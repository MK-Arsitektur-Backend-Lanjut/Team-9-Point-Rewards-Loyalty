version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - COMPOSER_PROCESS_TIMEOUT=2000
    container_name: loyalty-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - loyalty_network
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: loyalty-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-loyalty_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - loyalty_network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    container_name: loyalty-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - loyalty_network

  webserver:
    image: nginx:alpine
    container_name: loyalty-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - loyalty_network
    depends_on:
      - app

volumes:
  db_data:

networks:
  loyalty_network:
    driver: bridge
      - membership_network

  # PHP-FPM & Laravel App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: membership_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    networks:
      - membership_network
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    command: >
      sh -c "cp .env.docker .env &&
             php artisan key:generate --force &&
             php artisan jwt:secret --force &&
             php artisan migrate --force &&
             php artisan optimize --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # phpMyAdmin (opsional, untuk manage database)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: membership_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootsecret
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - membership_network

networks:
  membership_network:
    driver: bridge

volumes:
  mysql_data:
