[www]
user = www-data
group = www-data
listen = 9000

; Dynamic process manager — scale up to 100 workers under load
pm = dynamic
pm.max_children = 100
pm.start_servers = 20
pm.min_spare_servers = 10
pm.max_spare_servers = 30
pm.max_requests = 500

; Prevent slow requests from blocking the pool
request_terminate_timeout = 60s
